{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-dark" href="{% url 'index' %}">Media Club</a>

            <div>
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'club_create' %}">Create Club</a>

                    <a class="btn btn-outline-light btn-sm" href="{% url 'profile' user.username %}">{{user.username}}</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log In</a>
                    <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block body %}{% endblock %}
    </div>
</body>
</html>
