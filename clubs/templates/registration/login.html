{% extends "clubs/layout.html" %}

{% block title %}Log In{% endblock %}

{% block body %}
    <h1>Log in</h1>
    <p>Please, use the following form to log in:</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
{% endblock %}
